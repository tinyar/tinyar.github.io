<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📜张若虚·春江花月夜</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #24292e;
            background-color: white;
            min-height: 100vh;
        }
        #renderedHtml.markdown-body {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .markdown-body pre {
            background-color: #f6f8fa;
        }
    </style>
</head>
<body>
    <div id="renderedHtml" class="markdown-body"></div>

    <script>
        // 配置 marked
        marked.setOptions({
            gfm: true, // 启用 GitHub 风格的 Markdown
            breaks: true, // 将换行符转换为 <br>
            headerIds: false
        });

        // 主加载函数
        async function loadAndRenderMarkdown() {
            const fileName = '张若虚·春江花月夜.md';

            try {
                const response = await fetch(fileName);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const markdownText = await response.text();
                
                // 渲染为 HTML
                document.getElementById('renderedHtml').innerHTML = marked.parse(markdownText);

            } catch (error) {
                console.error('加载或渲染失败:', error);
                document.getElementById('renderedHtml').innerHTML = 
                    marked.parse(`# 错误\n文件加载失败。\n\n请确保：\n1. 目录下存在md文件。\n2. 通过HTTP服务器访问此页面。\n\n错误详情：${error.message}`);
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadAndRenderMarkdown);
    </script>
</body>
</html>

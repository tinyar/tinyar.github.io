<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown文件转HTML网页</title>
    <!-- 引入marked库用于解析Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入highlight.js用于代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        body {
            background-color: #f6f8fa;
            color: #24292f;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #d0d7de;
        }
        header h1 {
            color: #0969da;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        header p {
            color: #656d76;
            font-size: 1.1em;
            max-width: 600px;
            margin: 0 auto;
        }
        .file-upload-section {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px rgba(140, 149, 159, 0.15);
            text-align: center;
        }
        .upload-area {
            border: 2px dashed #d0d7de;
            border-radius: 8px;
            padding: 40px 20px;
            margin-bottom: 20px;
            transition: border-color 0.3s, background-color 0.3s;
            cursor: pointer;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #0969da;
            background-color: #f6f8fa;
        }
        .upload-icon {
            font-size: 48px;
            color: #656d76;
            margin-bottom: 15px;
        }
        .upload-area h3 {
            color: #24292f;
            margin-bottom: 10px;
        }
        .upload-area p {
            color: #656d76;
            margin-bottom: 20px;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .btn {
            display: inline-block;
            background-color: #0969da;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0858c7;
        }
        .btn:active {
            background-color: #074aaf;
        }
        .file-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #f6f8fa;
            border-radius: 6px;
            text-align: left;
        }
        .file-info.hidden {
            display: none;
        }
        .file-info h4 {
            margin-bottom: 10px;
            color: #24292f;
        }
        .file-info p {
            margin-bottom: 5px;
            color: #656d76;
        }
        .render-section {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px rgba(140, 149, 159, 0.15);
            overflow: hidden;
        }
        .render-header {
            background-color: #f6f8fa;
            padding: 20px 30px;
            border-bottom: 1px solid #d0d7de;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .render-header h2 {
            color: #24292f;
        }
        .render-content {
            padding: 30px;
            min-height: 200px;
        }
        .placeholder {
            text-align: center;
            color: #656d76;
            padding: 60px 20px;
        }
        .placeholder-icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #d0d7de;
        }
        /* Markdown样式渲染 */
        .markdown-body {
            font-size: 16px;
            line-height: 1.7;
        }
        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3, 
        .markdown-body h4 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eaecef;
        }
        .markdown-body h1 { font-size: 2em; }
        .markdown-body h2 { font-size: 1.5em; }
        .markdown-body h3 { font-size: 1.25em; }
        .markdown-body p { margin-bottom: 16px; }
        .markdown-body ul, .markdown-body ol {
            padding-left: 2em;
            margin-bottom: 16px;
        }
        .markdown-body li { margin-bottom: 0.5em; }
        .markdown-body li > p { margin-top: 16px; }
        .markdown-body code {
            background-color: rgba(27,31,35,0.05);
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            font-size: 85%;
        }
        .markdown-body pre {
            background-color: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow: auto;
            margin-bottom: 16px;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-body blockquote {
            padding: 0 1em;
            color: #6a737d;
            border-left: 0.25em solid #dfe2e5;
            margin-bottom: 16px;
        }
        .markdown-body a {
            color: #0366d6;
            text-decoration: none;
        }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #dfe2e5;
            padding: 6px 13px;
        }
        .markdown-body th {
            background-color: #f6f8fa;
            font-weight: 600;
        }
        .markdown-body img { 
            max-width: 100%; 
            box-sizing: border-box;
        }
        .markdown-body hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: #e1e4e8;
            border: 0;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            color: #656d76;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            header {
                padding: 20px 0;
            }
            header h1 {
                font-size: 2em;
            }
            .file-upload-section, .render-section {
                padding: 20px;
            }
            .render-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Markdown文件转HTML网页</h1>
            <p>选择本地Markdown文件，渲染为美观的HTML文档，支持拖放上传。</p>
        </header>
        
        <section class="file-upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h3>选择Markdown文件</h3>
                <p>拖放文件到此处，或点击按钮选择文件</p>
                <div class="file-input-wrapper">
                    <button class="btn" id="selectFileBtn">选择文件</button>
                    <input type="file" id="fileInput" class="file-input" accept=".md,.markdown,text/markdown">
                </div>
            </div>
            
            <div class="file-info hidden" id="fileInfo">
                <h4>已选择文件</h4>
                <p>文件名: <span id="fileName">-</span></p>
                <p>文件大小: <span id="fileSize">-</span></p>
                <p>最后修改: <span id="fileModified">-</span></p>
            </div>
        </section>
        
        <section class="render-section">
            <div class="render-header">
                <h2>渲染结果</h2>
                <div class="btn" id="downloadBtn" style="display:none;">下载HTML</div>
            </div>
            <div class="render-content" id="renderContent">
                <div class="placeholder" id="placeholder">
                    <div class="placeholder-icon">📄</div>
                    <h3>等待Markdown文件</h3>
                    <p>请选择或拖放一个Markdown文件到上方区域</p>
                    <p>支持的文件格式: .md, .markdown</p>
                </div>
                <div id="markdownOutput" class="markdown-body" style="display:none;"></div>
            </div>
        </section>
    </div>

    <script>
        // 配置marked
        marked.setOptions({
            breaks: true,          // 将换行符转换为<br>
            gfm: true,             // 启用GitHub Flavored Markdown
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {
                        console.error('代码高亮错误:', err);
                    }
                }
                return code;
            }
        });

        // 获取DOM元素
        const fileInput = document.getElementById('fileInput');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const uploadArea = document.getElementById('uploadArea');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileModified = document.getElementById('fileModified');
        const placeholder = document.getElementById('placeholder');
        const markdownOutput = document.getElementById('markdownOutput');
        const renderContent = document.getElementById('renderContent');
        const downloadBtn = document.getElementById('downloadBtn');

        // 文件选择按钮点击事件
        selectFileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件输入变化事件
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // 拖放事件处理
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                // 检查文件类型
                if (file.type === 'text/markdown' || 
                    file.name.endsWith('.md') || 
                    file.name.endsWith('.markdown')) {
                    handleFile(file);
                } else {
                    alert('请选择Markdown文件（.md或.markdown格式）');
                }
            }
        });

        // 处理选择的文件
        function handleFile(file) {
            // 显示文件信息
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileModified.textContent = new Date(file.lastModified).toLocaleString();
            fileInfo.classList.remove('hidden');
            
            // 读取文件内容
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                renderMarkdown(content, file.name);
            };
            reader.onerror = function() {
                alert('读取文件时发生错误，请重试');
            };
            reader.readAsText(file);
        }

        // 渲染Markdown内容
        function renderMarkdown(content, filename) {
            // 隐藏占位符，显示渲染结果
            placeholder.style.display = 'none';
            markdownOutput.style.display = 'block';
            
            // 解析Markdown为HTML
            const html = marked.parse(content);
            markdownOutput.innerHTML = html;
            
            // 显示下载按钮
            downloadBtn.style.display = 'block';
            downloadBtn.onclick = () => downloadHTML(html, filename);
            
            // 滚动到渲染区域
            renderContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 下载HTML文件
        function downloadHTML(html, filename) {
            // 创建完整的HTML文档
            const fullHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${filename.replace('.md', '').replace('.markdown', '')}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"><\/script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            line-height: 1.7;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            color: #24292f;
            background-color: #ffffff;
        }
        .markdown-body {
            font-size: 16px;
        }
        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3, 
        .markdown-body h4 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eaecef;
        }
        .markdown-body h1 { font-size: 2em; }
        .markdown-body h2 { font-size: 1.5em; }
        .markdown-body h3 { font-size: 1.25em; }
        .markdown-body p { margin-bottom: 16px; }
        .markdown-body ul, .markdown-body ol {
            padding-left: 2em;
            margin-bottom: 16px;
        }
        .markdown-body li { margin-bottom: 0.5em; }
        .markdown-body code {
            background-color: rgba(27,31,35,0.05);
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            font-size: 85%;
        }
        .markdown-body pre {
            background-color: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow: auto;
            margin-bottom: 16px;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-body blockquote {
            padding: 0 1em;
            color: #6a737d;
            border-left: 0.25em solid #dfe2e5;
            margin-bottom: 16px;
        }
        .markdown-body a {
            color: #0366d6;
            text-decoration: none;
        }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #dfe2e5;
            padding: 6px 13px;
        }
        .markdown-body th {
            background-color: #f6f8fa;
            font-weight: 600;
        }
        .markdown-body img { 
            max-width: 100%; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="markdown-body">
        ${html}
    </div>
    <script>hljs.highlightAll();<\/script>
</body>
</html>`;
            
            // 创建下载链接
            const blob = new Blob([fullHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename.replace('.md', '.html').replace('.markdown', '.html');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 初始化示例：如果没有选择文件，显示使用说明
        function initExample() {
            const exampleMarkdown = ``;
            
            // 渲染示例
            const exampleHtml = marked.parse(exampleMarkdown);
            placeholder.innerHTML = `<div class="markdown-body">${exampleHtml}</div>`;
        }

        // 页面加载完成后初始化示例
        document.addEventListener('DOMContentLoaded', initExample);
    </script>
</body>
</html>

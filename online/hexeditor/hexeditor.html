<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝十六进制编辑器HexEditor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', monospace;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #333;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 1rem;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            align-items: center;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }
        .btn-info {
            background: #3b82f6;
            color: white;
        }
        .btn-info:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            flex-grow: 1;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-input-wrapper .btn {
            width: 100%;
        }
        .file-info {
            background: #e0f2fe;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #0369a1;
            flex-grow: 2;
            min-height: 50px;
            display: flex;
            align-items: center;
        }
        .editor-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 300px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .hex-panel {
            flex: 2;
        }
        .panel-header {
            background: #4f46e5;
            color: white;
            padding: 15px;
            font-weight: 600;
            text-align: center;
        }
        .panel-content {
            flex: 1;
            overflow: auto;
            padding: 15px;
            background: #fefce8;
            min-height: 600px;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
            tab-size: 8;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .hex-panel .panel-content {
            background: #f0f9ff;
        }
        .ascii-panel .panel-content {
            background: #fefce8;
        }
        .hex-row {
            display: flex;
            margin-bottom: 2px;
        }
        .offset {
            color: #6b7280;
            font-weight: bold;
            min-width: 100px;
            padding-right: 15px;
            user-select: none;
        }
        .hex-byte {
            display: inline-block;
            width: 40px;
            text-align: center;
            margin: 0 4px;
            padding: 4px 2px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
            border: 1px solid transparent;
        }
        .hex-byte:hover {
            background: #dbeafe;
            border: 1px solid #93c5fd;
        }
        .hex-byte.edited {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }
        .hex-byte.editing {
            background: #dcfce7;
            border: 2px solid #10b981;
            outline: none;
        }
        .ascii-char {
            display: inline-block;
            width: 24px;
            text-align: center;
            margin: 0 3px;
            padding: 4px 2px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .ascii-char:hover {
            background: #dbeafe;
            border: 1px solid #93c5fd;
        }
        .ascii-char.edited {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }
        .ascii-char.editing {
            background: #dcfce7;
            border: 2px solid #10b981;
            outline: none;
        }
        .non-printable {
            color: #dc2626;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #475569;
            margin-top: 20px;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: Black;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateX(100px);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
        }
        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }
        .notification.success {
            background: #10b981;
        }
        .notification.error {
            background: #ef4444;
        }
        .notification.info {
            background: #3b82f6;
        }
        .empty-notice {
            display: block;
            text-align: center;
            color: #475569;
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 8px;
            background: #f1f5f9;
            border-radius: 6px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .editor-container {
                flex-direction: column;
            }
            .panel {
                min-width: 100%;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝十六进制编辑器HexEditor</h1>
            <p class="subtitle">上传、查看、编辑并下载二进制文件</p>
        </header>

        <div class="controls">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept="*/*">
                <button class="btn btn-primary" id="uploadBtn">📁 选择并加载文件</button>
            </div>
            <div class="button-group">
                <button class="btn btn-info" id="loadTestDataBtn">📄 加载测试数据文件</button>
                <button class="btn btn-success" id="downloadBtn" disabled>💾 下载修改后的文件</button>
                <button class="btn btn-warning" id="resetBtn" disabled>🔄 重置为原始文件</button>
            </div>
            <div class="file-info" id="fileInfo">当前为空白文件。请点击上方按钮上传文件或加载测试数据。</div>
        </div>

        <div class="empty-notice">当前为空白文件。您可以点击"选择并加载文件"按钮上传文件，或点击"加载测试数据文件"按钮加载默认的测试数据文件。</div>

        <div class="editor-container">
            <div class="panel hex-panel">
                <div class="panel-header">十六进制视图</div>
                <div class="panel-content" id="hexView"></div>
            </div>
            <div class="panel ascii-panel">
                <div class="panel-header">文本视图</div>
                <div class="panel-content" id="asciiView"></div>
            </div>
        </div>

        <div class="status-bar">
            <div>文件大小: <span id="fileSize">0</span> 字节</div>
            <div>已编辑字节: <span id="editedCount">0</span></div>
            <div>光标位置: <span id="cursorPos">-</span></div>
        </div>
    </div>

    <div id="notification" class="notification"></div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        class HexEditor {
            constructor() {
                this.originalData = null;
                this.currentData = null;
                this.fileName = '';
                this.fileSize = 0;
                this.editedBytes = new Set();
                this.isEditing = false;
                this.currentEditElement = null;
                this.currentEditIndex = -1;
                this.currentEditType = '';
                this.BYTES_PER_ROW = 16;
                this.init();
                
                // 页面加载时创建空白文件
                this.loadEmptyFile();
            }

            init() {
                this.fileInput = document.getElementById('fileInput');
                this.uploadBtn = document.getElementById('uploadBtn');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.loadTestDataBtn = document.getElementById('loadTestDataBtn');
                this.fileInfo = document.getElementById('fileInfo');
                this.hexView = document.getElementById('hexView');
                this.asciiView = document.getElementById('asciiView');
                this.fileSizeSpan = document.getElementById('fileSize');
                this.editedCountSpan = document.getElementById('editedCount');
                this.cursorPosSpan = document.getElementById('cursorPos');
                this.notification = document.getElementById('notification');
                this.loadingOverlay = document.getElementById('loadingOverlay');

                this.uploadBtn.addEventListener('click', () => this.fileInput.click());
                this.fileInput.addEventListener('change', (e) => this.loadFile(e));
                this.downloadBtn.addEventListener('click', () => this.downloadFile());
                this.resetBtn.addEventListener('click', () => this.resetFile());
                this.loadTestDataBtn.addEventListener('click', () => this.loadTestData());

                document.addEventListener('keydown', (e) => this.handleGlobalKey(e));
            }

            showLoading() {
                this.loadingOverlay.classList.add('active');
            }

            hideLoading() {
                this.loadingOverlay.classList.remove('active');
            }

            loadEmptyFile() {
                // 创建空白文件
                const emptyData = new Uint8Array(0);
                this.processFileData(emptyData, 'empty.bin');
            }

            async loadTestData() {
                this.showLoading();
                
                try {
                    // 尝试加载测试文件
                    const response = await fetch('./TestData/DF39B351FCF9CC156D928FB50A27C9EA');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const testData = new Uint8Array(arrayBuffer);
                    
                    this.processFileData(testData, './TestData/DF39B351FCF9CC156D928FB50A27C9EA');
                    this.showNotification('已成功加载目录中的测试数据文件', 'success');
                } catch (error) {
                    console.error('加载测试数据文件失败:', error);
                    this.showNotification(`无法加载测试数据文件: ${error.message}。请确保测试数据文件存在于目录中。`, 'error');
                    
                    // 如果文件加载失败，回退到生成示例数据
                    this.loadFallbackTestData();
                } finally {
                    this.hideLoading();
                }
            }

            loadFallbackTestData() {
                // 回退方案：生成示例测试数据
                const testData = new Uint8Array(512);
                for (let i = 0; i < 512; i++) {
                    // 填充有规律的数据，便于观察
                    testData[i] = i % 256;
                }
                
                // 添加一些文本数据
                const text = " (Fallback)\n这是一个回退测试文件，因为未能加载到测试数据文件。\n请确保测试数据文件存在于目录中。\n";
                const textEncoder = new TextEncoder();
                const textData = textEncoder.encode(text);
                testData.set(textData, 0);
                
                this.processFileData(testData, 'Fallback_TestData.bin');
                this.showNotification('已加载回退测试数据。请确保测试数据文件存在于目录中。', 'warning');
            }

            async loadFile(event) {
               const file = event.target.files[0];
               if (!file) return;

               this.fileName = file.name;
               this.fileSize = file.size;
               this.fileInfo.textContent = `文件: ${this.fileName} (${this.formatFileSize(file.size)})`;
               this.fileSizeSpan.textContent = this.fileSize;

               try {
                   const arrayBuffer = await file.arrayBuffer();
                   this.processFileData(new Uint8Array(arrayBuffer), this.fileName);
                   this.showNotification(`文件 "${this.fileName}" 加载成功。`, 'success');
               } catch (error) {
                   this.showNotification(`读取文件时出错: ${error.message}`, 'error');
               } finally {
                   // 修复：重置文件输入框，以便再次选择同一个文件时也能触发change事件
                   event.target.value = null;
               }
           }

            processFileData(data, fileName) {
                this.originalData = new Uint8Array(data);
                this.currentData = new Uint8Array(data);
                this.fileName = fileName;
                this.editedBytes.clear();
                this.updateUI();
                
                // 如果有数据，启用下载和重置按钮
                if (data.length > 0) {
                    this.downloadBtn.disabled = false;
                    this.resetBtn.disabled = false;
                    this.fileInfo.textContent = `文件: ${fileName} (${this.formatFileSize(data.length)})`;
                } else {
                    this.downloadBtn.disabled = true;
                    this.resetBtn.disabled = true;
                    this.fileInfo.textContent = '当前为空白文件。请点击上方按钮上传文件或加载测试数据。';
                }
            }

            updateUI() {
                this.renderHexView();
                this.renderAsciiView();
                this.updateStatusBar();
            }

            renderHexView() {
                let html = '';
                const rows = Math.ceil(this.currentData.length / this.BYTES_PER_ROW);

                for (let row = 0; row < rows; row++) {
                    const offset = row * this.BYTES_PER_ROW;
                    html += `<div class="hex-row">`;
                    html += `<span class="offset">${offset.toString(16).padStart(8, '0').toUpperCase()}</span>`;

                    for (let col = 0; col < this.BYTES_PER_ROW; col++) {
                        const index = offset + col;
                        if (index < this.currentData.length) {
                            const byte = this.currentData[index];
                            const hex = byte.toString(16).padStart(2, '0').toUpperCase();
                            const isEdited = this.editedBytes.has(index);
                            html += `<span class="hex-byte ${isEdited ? 'edited' : ''}" 
                                      data-index="${index}" 
                                      data-type="hex">${hex}</span>`;
                        } else {
                            html += `<span class="hex-byte" style="visibility:hidden;">00</span>`;
                        }
                        if (col === 7) html += ' ';
                    }
                    html += `</div>`;
                }
                this.hexView.innerHTML = html;

                this.hexView.querySelectorAll('.hex-byte').forEach(el => {
                    if (el.style.visibility !== 'hidden') {
                        el.addEventListener('click', (e) => this.startEdit(e.target));
                        el.addEventListener('keydown', (e) => this.handleKeydown(e));
                        el.addEventListener('blur', (e) => this.finishEdit(e.target));
                    }
                });
            }

            renderAsciiView() {
                let html = '';
                const rows = Math.ceil(this.currentData.length / this.BYTES_PER_ROW);

                for (let row = 0; row < rows; row++) {
                    const offset = row * this.BYTES_PER_ROW;
                    html += `<div class="hex-row">`;
                    html += `<span class="offset">${offset.toString(16).padStart(8, '0').toUpperCase()}</span>`;

                    for (let col = 0; col < this.BYTES_PER_ROW; col++) {
                        const index = offset + col;
                        if (index < this.currentData.length) {
                            const byte = this.currentData[index];
                            let char = '.';
                            if (byte >= 32 && byte <= 126) {
                                char = String.fromCharCode(byte);
                            } else if (byte === 9 || byte === 10 || byte === 13) {
                                char = byte === 9 ? '→' : byte === 10 ? '↓' : '←';
                            }
                            const isEdited = this.editedBytes.has(index);
                            const className = `ascii-char ${isEdited ? 'edited' : ''} ${(byte >= 32 && byte <= 126) ? '' : 'non-printable'}`;
                            html += `<span class="${className}" 
                                          data-index="${index}" 
                                          data-type="ascii">${char}</span>`;
                        } else {
                            html += `<span class="ascii-char" style="visibility:hidden;">.</span>`;
                        }
                    }
                    html += `</div>`;
                }
                this.asciiView.innerHTML = html;

                this.asciiView.querySelectorAll('.ascii-char').forEach(el => {
                    if (el.style.visibility !== 'hidden') {
                        el.addEventListener('click', (e) => this.startEdit(e.target));
                        el.addEventListener('keydown', (e) => this.handleKeydown(e));
                        el.addEventListener('blur', (e) => this.finishEdit(e.target));
                    }
                });
            }

            startEdit(element) {
                if (this.isEditing && this.currentEditElement === element) {
                    return; // 已经在编辑此元素
                }
                
                if (this.isEditing) {
                    this.finishEdit(this.currentEditElement);
                }

                this.isEditing = true;
                this.currentEditElement = element;
                this.currentEditIndex = parseInt(element.dataset.index);
                this.currentEditType = element.dataset.type;

                // 设置元素为可编辑状态
                element.contentEditable = true;
                element.classList.add('editing');
                element.focus();
                
                // 选中元素中的文本
                this.selectAllText(element);

                this.cursorPosSpan.textContent = `0x${this.currentEditIndex.toString(16).toUpperCase()} (${this.currentEditIndex})`;
            }

            selectAllText(element) {
                const range = document.createRange();
                range.selectNodeContents(element);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                
                // 对于input-like的编辑体验，我们设置一个定时器确保选中
                setTimeout(() => {
                    selection.selectAllChildren(element);
                }, 0);
            }

            handleKeydown(event) {
                if (!this.isEditing) return;
                
                const element = event.target;
                const type = element.dataset.type;
                
                switch(event.key) {
                    case 'Enter':
                        event.preventDefault();
                        this.finishEdit(element);
                        break;
                        
                    case 'Tab':
                        event.preventDefault();
                        this.finishEdit(element);
                        // 如果是Tab键，移动到下一个字节
                        if (!event.shiftKey) {
                            this.moveToNextByte();
                        } else {
                            this.moveToPrevByte();
                        }
                        break;
                        
                    case 'Escape':
                        event.preventDefault();
                        this.cancelEdit(element);
                        break;
                        
                    case 'ArrowRight':
                        if (type === 'hex') {
                            event.preventDefault();
                            this.finishEdit(element);
                            this.moveToNextByte();
                        }
                        break;
                        
                    case 'ArrowLeft':
                        if (type === 'hex') {
                            event.preventDefault();
                            this.finishEdit(element);
                            this.moveToPrevByte();
                        }
                        break;
                        
                    case 'ArrowUp':
                        event.preventDefault();
                        this.finishEdit(element);
                        this.moveToUpByte();
                        break;
                        
                    case 'ArrowDown':
                        event.preventDefault();
                        this.finishEdit(element);
                        this.moveToDownByte();
                        break;
                        
                    default:
                        // 输入验证
                        if (type === 'hex') {
                            // 只允许十六进制字符
                            const validChars = '0123456789ABCDEFabcdef';
                            if (event.key.length === 1 && !validChars.includes(event.key)) {
                                event.preventDefault();
                            }
                            
                            // 限制长度为2，但允许删除键
                            if (element.textContent.length >= 2 && 
                                event.key !== 'Backspace' && 
                                event.key !== 'Delete' && 
                                event.key !== 'ArrowLeft' && 
                                event.key !== 'ArrowRight' &&
                                event.key !== 'ArrowUp' &&
                                event.key !== 'ArrowDown') {
                                // 如果已经有两个字符，新的输入应该替换整个内容
                                element.textContent = event.key.toUpperCase();
                                this.selectAllText(element);
                                event.preventDefault();
                            } else if (event.key.length === 1 && validChars.includes(event.key)) {
                                // 如果是有效字符，自动转换为大写
                                if (element.textContent.length === 0) {
                                    // 第一个字符
                                    element.textContent = event.key.toUpperCase();
                                    this.selectAllText(element);
                                    event.preventDefault();
                                } else if (element.textContent.length === 1) {
                                    // 第二个字符，完成编辑
                                    element.textContent = (element.textContent + event.key.toUpperCase()).slice(0, 2);
                                    setTimeout(() => {
                                        this.finishEdit(element);
                                        this.moveToNextByte();
                                    }, 10);
                                    event.preventDefault();
                                }
                            }
                        } else if (type === 'ascii') {
                            // 只允许单字符
                            if (element.textContent.length >= 1 && 
                                event.key !== 'Backspace' && 
                                event.key !== 'Delete' &&
                                event.key.length === 1) {
                                // 如果已经有一个字符，新的输入应该替换整个内容
                                element.textContent = event.key;
                                this.selectAllText(element);
                                event.preventDefault();
                            } else if (event.key.length === 1) {
                                // 输入一个字符后自动完成编辑
                                element.textContent = event.key;
                                setTimeout(() => {
                                    this.finishEdit(element);
                                    this.moveToNextByte();
                                }, 10);
                                event.preventDefault();
                            }
                        }
                        break;
                }
            }

            finishEdit(element) {
                if (!this.isEditing || this.currentEditElement !== element) return;
                
                const newValue = element.textContent.trim();
                const type = element.dataset.type;
                const index = parseInt(element.dataset.index);
                
                // 移除编辑状态
                element.contentEditable = false;
                element.classList.remove('editing');
                element.blur();
                
                // 应用编辑
                if (newValue !== '' && newValue !== this.getCurrentDisplayValue(index, type)) {
                    this.applyEdit(newValue, index, type);
                } else {
                    // 恢复原始显示
                    this.updateByteDisplay(index, this.currentData[index]);
                }
                
                this.isEditing = false;
                this.currentEditElement = null;
                this.currentEditIndex = -1;
                this.currentEditType = '';
            }

            cancelEdit(element) {
                if (!this.isEditing || this.currentEditElement !== element) return;
                
                // 恢复原始显示
                const index = parseInt(element.dataset.index);
                this.updateByteDisplay(index, this.currentData[index]);
                
                // 移除编辑状态
                element.contentEditable = false;
                element.classList.remove('editing');
                element.blur();
                
                this.isEditing = false;
                this.currentEditElement = null;
                this.currentEditIndex = -1;
                this.currentEditType = '';
                this.cursorPosSpan.textContent = '-';
            }

            moveToNextByte() {
                if (this.currentEditIndex === -1 || this.currentEditIndex >= this.currentData.length - 1) return;
                
                const nextIndex = this.currentEditIndex + 1;
                const nextElement = document.querySelector(`[data-index="${nextIndex}"][data-type="${this.currentEditType}"]`);
                if (nextElement) {
                    setTimeout(() => {
                        this.startEdit(nextElement);
                    }, 10);
                }
            }

            moveToPrevByte() {
                if (this.currentEditIndex <= 0) return;
                
                const prevIndex = this.currentEditIndex - 1;
                const prevElement = document.querySelector(`[data-index="${prevIndex}"][data-type="${this.currentEditType}"]`);
                if (prevElement) {
                    setTimeout(() => {
                        this.startEdit(prevElement);
                    }, 10);
                }
            }

            moveToUpByte() {
                if (this.currentEditIndex < this.BYTES_PER_ROW) return;
                
                const upIndex = this.currentEditIndex - this.BYTES_PER_ROW;
                const upElement = document.querySelector(`[data-index="${upIndex}"][data-type="${this.currentEditType}"]`);
                if (upElement) {
                    setTimeout(() => {
                        this.startEdit(upElement);
                    }, 10);
                }
            }

            moveToDownByte() {
                if (this.currentEditIndex >= this.currentData.length - this.BYTES_PER_ROW) return;
                
                const downIndex = this.currentEditIndex + this.BYTES_PER_ROW;
                const downElement = document.querySelector(`[data-index="${downIndex}"][data-type="${this.currentEditType}"]`);
                if (downElement) {
                    setTimeout(() => {
                        this.startEdit(downElement);
                    }, 10);
                }
            }

            getCurrentDisplayValue(index, type) {
                if (type === 'hex') {
                    return this.currentData[index].toString(16).padStart(2, '0').toUpperCase();
                } else {
                    const byte = this.currentData[index];
                    if (byte >= 32 && byte <= 126) {
                        return String.fromCharCode(byte);
                    } else if (byte === 9) {
                        return '→';
                    } else if (byte === 10) {
                        return '↓';
                    } else if (byte === 13) {
                        return '←';
                    } else {
                        return '.';
                    }
                }
            }

            applyEdit(newValue, index, type) {
                if (index === -1) return;

                let newByte = this.currentData[index];
                let success = false;

                if (type === 'hex') {
                    newValue = newValue.toUpperCase();
                    if (/^[0-9A-F]{1,2}$/.test(newValue)) {
                        // 如果是单个字符，补全为两位
                        if (newValue.length === 1) {
                            newValue = '0' + newValue;
                        }
                        newByte = parseInt(newValue, 16);
                        success = true;
                    }
                } else {
                    if (newValue.length === 1) {
                        newByte = newValue.charCodeAt(0);
                        if (newByte >= 0 && newByte <= 255) {
                            success = true;
                        }
                    }
                }

                if (success) {
                    this.currentData[index] = newByte;
                    if (newByte !== this.originalData[index]) {
                        this.editedBytes.add(index);
                    } else {
                        this.editedBytes.delete(index);
                    }
                    this.updateByteDisplay(index, newByte);
                    this.updateStatusBar();
                } else {
                    // 如果输入无效，恢复原始显示
                    this.updateByteDisplay(index, this.currentData[index]);
                }
            }

            updateByteDisplay(index, byte) {
                const hexElement = this.hexView.querySelector(`.hex-byte[data-index="${index}"]`);
                const asciiElement = this.asciiView.querySelector(`.ascii-char[data-index="${index}"]`);

                if (hexElement) {
                    const hex = byte.toString(16).padStart(2, '0').toUpperCase();
                    hexElement.textContent = hex;
                    hexElement.classList.toggle('edited', this.editedBytes.has(index));
                }

                if (asciiElement) {
                    let char = '.';
                    if (byte >= 32 && byte <= 126) {
                        char = String.fromCharCode(byte);
                    } else if (byte === 9 || byte === 10 || byte === 13) {
                        char = byte === 9 ? '→' : byte === 10 ? '↓' : '←';
                    }
                    asciiElement.textContent = char;
                    asciiElement.classList.toggle('edited', this.editedBytes.has(index));
                    asciiElement.classList.toggle('non-printable', !(byte >= 32 && byte <= 126) && byte !== 9 && byte !== 10 && byte !== 13);
                }
            }

            handleGlobalKey(event) {
                if (event.key === 'Escape' && this.isEditing) {
                    this.cancelEdit(this.currentEditElement);
                }
            }

            updateStatusBar() {
                this.editedCountSpan.textContent = this.editedBytes.size;
                this.fileSizeSpan.textContent = this.currentData.length;
            }

            downloadFile() {
                if (!this.currentData) return;

                const blob = new Blob([this.currentData], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                a.download = this.fileName.replace(/(\.[^/.]+)?$/, `_modified_${timestamp}$&`);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                this.showNotification(`文件已下载为: ${a.download}`, 'success');
            }

            resetFile() {
                if (!this.originalData) return;

                if (confirm('确定要重置所有修改吗？这将丢失所有编辑。')) {
                    this.currentData = new Uint8Array(this.originalData);
                    this.editedBytes.clear();
                    this.updateUI();
                    this.showNotification('已重置为原始文件数据。', 'info');
                }
            }

            showNotification(message, type = 'info') {
                this.notification.textContent = message;
                this.notification.className = `notification ${type}`;
                this.notification.classList.add('show');

                setTimeout(() => {
                    this.notification.classList.remove('show');
                }, 3000);
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.hexEditor = new HexEditor();
        });
    </script>
</body>
</html>
